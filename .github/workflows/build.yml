name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ganyansosyal/ganyansosyal
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Hazirla
        run: |
          mkdir www assets
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='package*.json' --exclude='tjk-node.js' --exclude='cleanup.js' site/ www/
          cp site/icon-512.png assets/logo.png
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/splash-screen@7 @capacitor-firebase/authentication@7 firebase@11
          npm i -D @capacitor/assets@3
          npx cap add android
          cp google-services.json android/app/
          sed -i 's#</head>#<style>html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}html{zoom:0.88}*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}button,a,[onclick],nav{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}button:active,a:active,[onclick]:active{transform:none!important}</style></head>#' www/index.html
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f));c.android=Object.assign(c.android||{},{adjustMarginsForEdgeToEdge:'auto'});c.plugins=Object.assign(c.plugins||{},{FirebaseAuthentication:{skipNativeAuth:true,providers:['google.com']}});fs.writeFileSync(f,JSON.stringify(c,null,2))"
          MA=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(grep -m1 '^package' $MA)
          cat > $MA <<EOF
          $PKG

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  for (View v = getBridge().getWebView(); v != null; v = (v.getParent() instanceof View) ? (View) v.getParent() : null) { v.setOverScrollMode(View.OVER_SCROLL_NEVER); }
                  getBridge().getWebView().getSettings().setTextZoom(100);
              }
          }
          EOF
          npx capacitor-assets generate --android --iconBackgroundColor '#0E7A5A' --splashBackgroundColor '#0E7A5A'
          npx cap sync android
      - name: Derle
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Imzala
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cd android/app/build/outputs/apk/release
          $BT/zipalign -p -f 4 app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks $GITHUB_WORKSPACE/release.keystore --ks-pass pass:ganyan123 --key-pass pass:ganyan123 --ks-key-alias ganyan --out $GITHUB_WORKSPACE/GanyanSosyal.apk aligned.apk
          keytool -list -v -keystore $GITHUB_WORKSPACE/release.keystore -storepass ganyan123 -alias ganyan | grep SHA1
      - uses: actions/upload-artifact@v4
        with:
          name: GanyanSosyal-APK
          path: GanyanSosyal.apk
